name: Build Perkeep image

on:
  push:
    branches: [main]
    paths:
      - 'image/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      perkeep_version:
        description: 'Perkeep git tag or branch to build'
        required: false
        default: 'v0.12'

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/perkeep
  # Keep in sync with the default in image/Dockerfile.
  DEFAULT_PERKEEP_VERSION: v0.12

jobs:
  build:
    # amd64, matching the NAS. Builds natively -- no QEMU, no cross-compilation.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Perkeep version
        id: version
        run: |
          version="${{ inputs.perkeep_version }}"
          echo "value=${version:-$DEFAULT_PERKEEP_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PERKEEP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Perkeep version: \`${{ steps.version.outputs.value }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
